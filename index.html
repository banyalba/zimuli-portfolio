<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>李子沐 Zimu Li</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="李子沐 Zimu Li — 内容创作者｜项目负责人 · Content Creator | Project Lead">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&display=swap">
<style>
/* Layout concept: a field journal that changes weather as you scroll — cobalt sky with white roots,
   white-stone reading pages, deep forest bands with chartreuse moss. 12-col editorial grid, text and
   images side by side. Single deliberate palette (no dark/light switch); each section sets a "mood". */
:root{
  color-scheme: light;
  --cloud:#F5F7FF;      /* white branches, clouds */
  --stone:#EEF0E8;      /* white stone */
  --stone-2:#E1E5D9;
  --ink:#0E1C14;        /* forest floor */
  --ink-2:#3B4940;
  --ink-3:#6B776E;
  --rule:#C9D0C3;
  --forest:#1D4A2C;     /* forest */
  --forest-2:#245635;
  --moss:#CFE076;       /* soft moss */
  --sky:#2347D6;        /* cobalt sky */
  --sky-2:#1A37B4;

  --bg:var(--stone); --fg:var(--ink); --fg2:var(--ink-2); --fg3:var(--ink-3); --line:var(--rule);
  --surface:#F8F9F4; --well:var(--stone-2); --acc:var(--sky); --acc-fg:#fff; --mark:var(--moss); --chap:var(--forest);

  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-grotesk:"Manrope","Inter","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-display:var(--f-serif);
  --sky-solid:rgb(35,71,214);

  --fs-hero:clamp(72px,12vw,184px);
  --fs-h1:clamp(40px,6vw,84px);
  --fs-h2:clamp(28px,3.6vw,46px);
  --fs-h3:clamp(19px,1.7vw,23px);
  --fs-lead:clamp(16px,1.35vw,19px);
  --lh:1.85;
  --gut:max(clamp(16px,4vw,56px), env(safe-area-inset-left,0px));
  --gut-r:max(clamp(16px,4vw,56px), env(safe-area-inset-right,0px));
  --max:1360px;
  --sec:clamp(72px,10vw,152px);
  --hdr:64px;
  --gap:clamp(16px,2.4vw,40px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
body[data-mood="forest"]{ --bg:var(--forest); --fg:#EEF4E6; --fg2:#C3D6BC; --fg3:#93AE90; --line:#3A6A47; --surface:var(--forest-2); --well:#285E38; --acc:var(--moss); --acc-fg:var(--forest); --chap:var(--moss) }
body[data-mood="sky"]{ --bg:var(--sky); --fg:var(--cloud); --fg2:rgba(245,247,255,.84); --fg3:rgba(245,247,255,.64); --line:rgba(245,247,255,.3); --surface:#2E52E2; --well:#1D3CC2; --acc:var(--moss); --acc-fg:var(--ink); --chap:var(--moss) }
html[lang="en"]{ --f-display:var(--f-grotesk); --lh:1.65 }
*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }
body{ background:var(--bg-live,var(--bg)); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:var(--lh); -webkit-font-smoothing:antialiased; overflow-x:hidden; transition:color .5s var(--ease) }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--bg-live,var(--bg)) }
img,video{ max-width:100%; display:block }
a{ color:inherit }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer }
h1,h2,h3,h4{ margin:0; font-weight:600; text-wrap:balance }
p{ margin:0 }
ul,ol{ margin:0; padding:0; list-style:none }
:focus-visible{ outline:2px solid var(--acc); outline-offset:3px }
main:focus{ outline:none }
::selection{ background:var(--moss); color:var(--ink) }

.wrap{ max-width:var(--max); margin:0 auto; padding-left:var(--gut); padding-right:var(--gut-r) }
.skip{ position:absolute; left:-999px; top:8px; z-index:100; background:var(--fg); color:var(--bg); padding:8px 14px }
.skip:focus{ left:16px }
main.enter{ animation:enter .55s var(--ease) both }
@keyframes enter{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

/* type */
.label{ font-family:var(--f-grotesk); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg3); font-weight:500; line-height:1.4 }
.label-row{ display:flex; align-items:center; gap:12px }
.label-row::before{ content:""; width:28px; height:1px; background:currentColor; opacity:.6 }
.display{ font-family:var(--f-display); font-weight:600; letter-spacing:.01em; line-height:1.14 }
html[lang="en"] .display{ font-weight:500; letter-spacing:-.025em; line-height:1.04 }
.h1{ font-size:var(--fs-h1) } .h2{ font-size:var(--fs-h2) }
.h3{ font-family:var(--f-display); font-size:var(--fs-h3); font-weight:600; line-height:1.35 }
.lead{ font-size:var(--fs-lead); color:var(--fg2); max-width:38em }
.body{ color:var(--fg2); max-width:36em }
.small{ font-size:14px; color:var(--fg3); line-height:1.65 }
.note{ font-size:13px; color:var(--fg3); line-height:1.6; display:flex; gap:8px; max-width:46em }
.note::before{ content:"*"; color:var(--fg2) }
.num{ font-family:var(--f-grotesk); font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-.035em; line-height:1 }

/* interactive primitives */
.btn{ position:relative; display:inline-flex; align-items:center; gap:12px; height:50px; padding:0 24px; border:1px solid var(--fg); border-radius:999px; font-family:var(--f-grotesk); font-size:14px; font-weight:600; text-decoration:none; overflow:hidden; isolation:isolate; white-space:nowrap; transition:transform .45s var(--spring), color .3s, border-color .3s, background .3s }
.btn::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--acc); transform:translateY(101%); transition:transform .45s var(--ease) }
.btn:hover{ transform:translateY(-2px) scale(1.05); color:var(--acc-fg); border-color:var(--acc) }
.btn:hover::before{ transform:none }
.btn:active{ transform:scale(.98) }
.btn-solid{ background:var(--fg); color:var(--bg) }
.arrow{ display:inline-block; transition:transform .35s var(--ease) }
.btn:hover .arrow,.tlink:hover .arrow{ transform:translateX(5px) }
.tlink{ display:inline-flex; align-items:center; gap:10px; font-family:var(--f-grotesk); font-weight:600; font-size:14px; text-decoration:none; color:var(--fg); padding:6px 0; background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat; transition:background-size .35s var(--ease), color .2s }
.tlink:hover{ color:var(--acc); background-size:100% 2px }
body[data-mood="sky"] .tlink:hover,body[data-mood="forest"] .tlink:hover{ color:var(--moss) }
.ext::after{ content:"↗" }
.chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--f-grotesk); font-size:12px; font-weight:500; letter-spacing:.03em; padding:5px 12px; border:1px solid var(--line); color:var(--fg2); border-radius:999px; line-height:1.3; transition:transform .35s var(--spring), border-color .2s, color .2s }
.chip-moss{ border-color:transparent; background:var(--moss); color:var(--ink) }
.chip-acc{ border-color:transparent; background:var(--acc); color:var(--acc-fg) }
.chip-dot::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor }
.tags{ display:flex; flex-wrap:wrap; gap:8px }
.rootline{ display:block; width:100%; height:44px; color:var(--line); overflow:visible }
.rootline path{ fill:none; stroke:currentColor; stroke-width:1.2; vector-effect:non-scaling-stroke }

/* header */
.hdr{ position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--bg-live,var(--bg)); transition:box-shadow .3s }
.hdr.scrolled{ box-shadow:0 1px 0 var(--line) }
.hdr-in{ height:var(--hdr); display:flex; align-items:center; gap:12px }
.logo{ display:flex; align-items:baseline; gap:10px; text-decoration:none; white-space:nowrap; margin-right:auto; transition:transform .4s var(--spring) }
.logo:hover{ transform:scale(1.05) }
.logo b{ font-family:var(--f-serif); font-weight:600; font-size:19px; letter-spacing:.06em }
.logo span{ font-family:var(--f-grotesk); font-size:13px; color:var(--fg3) }
.nav{ display:flex; gap:2px; align-items:center }
.nav button{ position:relative; font-size:14px; color:var(--fg2); padding:6px 12px; border-radius:999px; white-space:nowrap; transition:color .2s, background-color .25s, transform .4s var(--spring) }
html[lang="en"] .nav button{ font-family:var(--f-grotesk); font-size:13px; font-weight:500 }
.nav button:hover{ color:var(--fg); background:color-mix(in srgb, var(--fg) 10%, transparent); transform:scale(1.08) }
.nav button[aria-current="true"]{ color:var(--fg); background:color-mix(in srgb, var(--fg) 7%, transparent) }
.nav button::after{ content:""; position:absolute; left:50%; bottom:-3px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--moss); transform:scale(0); transition:transform .4s var(--spring) }
.nav button[aria-current="true"]::after{ transform:none }
.hdr.tight .nav{ display:none } .hdr.tight .menu-btn{ display:inline-block }
.lang{ display:inline-flex; align-items:center; gap:6px; font-family:var(--f-grotesk); font-size:13px; height:34px; padding:0 13px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; margin-left:6px; transition:transform .4s var(--spring), border-color .2s }
.lang:hover{ transform:scale(1.08); border-color:var(--fg) }
.lang .on{ color:var(--fg); font-weight:600 } .lang .off{ color:var(--fg3) } .lang i{ font-style:normal; color:var(--line) }
.menu-btn{ display:none; height:34px; padding:0 14px; border:1px solid var(--line); border-radius:999px; font-family:var(--f-grotesk); font-size:13px; font-weight:600; transition:transform .4s var(--spring) }
.menu-btn:hover{ transform:scale(1.08) }
.backdock{ position:sticky; bottom:0; height:80px; display:flex; align-items:flex-end; z-index:45; pointer-events:none }
.backdock .wrap{ position:relative; width:100%; height:0 }
.backbtn{ position:absolute; left:var(--gut); bottom:calc(env(safe-area-inset-bottom,0px) + 16px); display:inline-flex; align-items:center; gap:10px; height:50px; padding:0 24px 0 18px; border-radius:999px; background:var(--moss); color:var(--ink); font-family:var(--f-grotesk); font-size:15px; font-weight:600; box-shadow:0 12px 28px -14px rgba(14,28,20,.55); text-decoration:none; white-space:nowrap; opacity:0; transform:translateY(10px); pointer-events:none; transition:opacity .3s, transform .45s var(--spring) }
.backbtn span{ display:inline-block; font-size:17px; transition:transform .35s var(--spring) }
body.deep .backbtn{ opacity:1; transform:none; pointer-events:auto }
body.deep .backbtn:hover{ transform:scale(1.06) }
body.deep .backbtn:hover span{ transform:translateX(-3px) }
.backbtn:focus-visible{ opacity:1; transform:none; outline:2px solid var(--ink); outline-offset:3px }
@media (max-width:660px){ .backdock{ height:68px } .backbtn{ height:44px; font-size:14px; padding:0 20px 0 16px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px) } }
@media (max-width:1040px){ .logo span{ display:none } .nav a{ padding:6px 9px } }
@media (max-width:820px){ .nav a{ padding:6px 6px; font-size:13px } html[lang="en"] .nav a{ font-size:12px } .lang{ margin-left:0; padding:0 10px } }
@media (max-width:660px){ .nav{ display:none } .menu-btn{ display:inline-block } }
.mnav{ position:fixed; inset:0; z-index:70; background:var(--forest); color:#EAF0E2; padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gut-r) 32px var(--gut); display:flex; flex-direction:column; animation:mnav .45s var(--ease) both }
@keyframes mnav{ from{ clip-path:inset(0 0 100% 0) } to{ clip-path:inset(0) } }
.mnav-top{ display:flex; justify-content:space-between; align-items:center; height:48px }
.mnav ul{ margin-top:12px; display:flex; flex-direction:column }
.mnav li{ animation:enter .5s var(--ease) both }
.mnav-h{ margin-top:28px; font-family:var(--f-grotesk); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#869886 }
.mnav li button{ width:100%; text-align:left }
.mnav li a,.mnav li button{ display:flex; justify-content:space-between; align-items:baseline; text-decoration:none; padding:16px 0; border-bottom:1px solid #2D4A37; transition:padding .3s var(--ease), color .2s }
.mnav li a:hover,.mnav li button:hover{ padding-left:10px; color:var(--moss) }
.mnav li b{ font-family:var(--f-display); font-size:26px; font-weight:600; line-height:1.3 }
.mnav li span{ font-family:var(--f-grotesk); font-size:12px; color:#869886; letter-spacing:.12em; text-transform:uppercase }
.mnav li [aria-current="true"] b{ color:var(--moss) }
.mnav .mhome{ display:inline-flex; gap:8px; align-items:center; margin-top:20px; font-family:var(--f-grotesk); font-size:14px; font-weight:600; color:#EAF0E2; text-decoration:none }
.mnav .lang{ border-color:#2D4A37 }

/* reveal */
.pre{ opacity:0; transform:translateY(26px) }
.rv{ transition:opacity 1s var(--ease), transform 1s var(--ease); transition-delay:var(--d,0s) }
@media (prefers-reduced-motion:reduce){ .pre{ opacity:1; transform:none } .rv{ transition:none } main.enter{ animation:none } .backbtn, .backbtn span{ transition:none } }

/* media */
.zoom{ display:block; width:100%; position:relative; cursor:zoom-in; background:var(--well); overflow:hidden; transition:transform .5s var(--spring), box-shadow .4s }
.zoom img{ width:100%; height:auto; transition:transform .9s var(--ease) }
.zoom:hover{ transform:scale(1.025); box-shadow:0 22px 46px -22px rgba(10,20,14,.45); z-index:2 }
.zoom:hover img{ transform:scale(1.04) }
.zoom.contain{ background:transparent }
figure{ margin:0; min-width:0; position:relative }
.vref{ display:block; margin-top:3px; font-size:11.5px; line-height:1.5; color:var(--fg3); opacity:.78 }
figcaption{ margin-top:12px; font-size:13px; color:var(--fg3); line-height:1.55; display:flex; gap:10px; align-items:baseline }
.vid{ position:relative; display:block; width:100%; aspect-ratio:4/3; background:#000; overflow:hidden; cursor:pointer; transition:transform .5s var(--spring) }
.vid:hover{ transform:scale(1.025) }
.vid img{ width:100%; height:100%; object-fit:cover; opacity:.85; transition:opacity .4s, transform .9s var(--ease) }
.vid:hover img{ opacity:1; transform:scale(1.05) }
.play{ position:absolute; left:16px; bottom:16px; display:flex; align-items:center; gap:10px; color:#fff; font-family:var(--f-grotesk); font-size:13px; font-weight:600; text-shadow:0 1px 8px rgba(0,0,0,.5) }
.play i{ width:46px; height:46px; border-radius:50%; background:var(--moss); display:grid; place-items:center; transition:transform .4s var(--spring) }
.vid:hover .play i,.stage:hover .play i{ transform:scale(1.15) }
.play i::before{ content:""; border-left:12px solid var(--ink); border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:3px }
.missing{ display:flex; flex-direction:column; justify-content:space-between; gap:12px; padding:16px; border:1px dashed var(--line); background:repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--fg) 5%, transparent) 10px 11px); color:var(--fg3); font-size:13px; max-width:100% }
.missing .code{ font-family:var(--f-grotesk); font-size:11px; letter-spacing:.1em }
.missing b{ font-weight:500; color:var(--fg2) }

/* dock (macOS-style magnification) */
.dock{ display:flex; align-items:flex-end; gap:clamp(5px,.7vw,10px); position:relative; z-index:3 }
.dk{ flex:1 1 0; min-width:0; position:relative; display:block; background:var(--well); cursor:zoom-in }
.dk img{ width:100%; aspect-ratio:var(--r,3/4); object-fit:cover; display:block }
.dk.on{ z-index:2; box-shadow:0 18px 36px -14px rgba(10,20,14,.55) }
.dk .pv{ position:absolute; right:6px; bottom:6px; width:22px; height:22px; border-radius:50%; background:var(--moss); display:grid; place-items:center }
.dk .pv::before{ content:""; border-left:7px solid var(--ink); border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; margin-left:2px }
.dock-cap{ margin-top:12px; display:flex; justify-content:space-between; gap:16px; font-size:13px; color:var(--fg3); min-height:1.5em }
.dock-cap b{ color:var(--fg); font-weight:500 }
@media (hover:none),(max-width:660px){
  .dock{ overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:10px; height:auto !important; align-items:flex-start }
  .dk{ flex:0 0 30% !important; scroll-snap-align:start }
}
.stage{ position:relative; display:block; width:100%; aspect-ratio:var(--sr,4/3); background:var(--well); overflow:hidden; cursor:zoom-in; transition:transform .5s var(--spring) }
.stage:hover{ transform:scale(1.01) }
.stage img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transition:opacity .3s var(--ease) }
.stage .play{ opacity:0; transition:opacity .3s }
.stage.is-video{ cursor:pointer }
.stage.is-video .play{ opacity:1 }

/* hero */
.hero{ --fg:var(--cloud); --fg2:rgba(245,247,255,.84); --fg3:rgba(245,247,255,.64); --line:rgba(245,247,255,.3); --acc:var(--moss); --acc-fg:var(--ink); color:var(--fg); position:relative; min-height:clamp(520px, 66svh, 760px); display:flex; align-items:flex-end; overflow:hidden; isolation:isolate }
.hero canvas{ position:absolute; inset:0; width:100%; height:100%; z-index:-1; touch-action:pan-y }
@media (min-width:661px){ .hero canvas{ -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.3) 32%, #000 58%); mask-image:linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.3) 32%, #000 58%) } }
@media (max-width:660px){ .hero canvas{ -webkit-mask-image:linear-gradient(180deg, #000 0, #000 40%, rgba(0,0,0,.18) 62%); mask-image:linear-gradient(180deg, #000 0, #000 40%, rgba(0,0,0,.18) 62%) } }
.hero-in{ width:100%; padding-block:clamp(44px,6vw,80px) clamp(36px,4.2vw,60px) }
.hero-name{ display:flex; align-items:baseline; flex-wrap:wrap; gap:.1em .35em; margin-top:22px }
.hero-name .cn{ font-family:var(--f-serif); font-weight:600; font-size:var(--fs-hero); line-height:.95; letter-spacing:.04em }
.hero-name .en{ font-family:var(--f-grotesk); font-weight:300; font-size:calc(var(--fs-hero) * .26); color:var(--fg); text-shadow:0 0 .14em var(--sky-solid), 0 0 .36em var(--sky-solid) }
.hero-role{ margin-top:28px; display:inline-flex; align-items:center; gap:12px; font-size:clamp(18px,1.8vw,24px); font-weight:500; letter-spacing:.04em }
.hero-role::before{ content:""; width:12px; height:12px; border-radius:50%; background:var(--moss); flex:0 0 auto }
html[lang="en"] .hero-role{ font-family:var(--f-grotesk); letter-spacing:0 }
.hero-tag{ margin-top:10px; max-width:24em; font-family:var(--f-serif); font-size:clamp(17px,1.5vw,20px); color:var(--fg2) }
html[lang="en"] .hero-tag{ font-family:var(--f-grotesk) }
.hero-intro{ margin-top:20px; max-width:31em; color:var(--fg2); font-size:15px }
.hero-cta{ margin-top:34px; display:flex; flex-wrap:wrap; gap:12px }
.hero-note{ position:absolute; right:var(--gut-r); bottom:30px; font-family:var(--f-grotesk); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg3); display:flex; align-items:center; gap:10px }
.hero-note::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--moss); animation:pulse 2.2s ease-in-out infinite }
@keyframes pulse{ 50%{ transform:scale(1.7); opacity:.5 } }
@media (max-width:660px),(hover:none){ .hero-note{ display:none } }

/* sections */
.sec{ padding-block:var(--sec) 0 }
.sec-head{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); column-gap:var(--gap); row-gap:20px; align-items:end; margin-bottom:clamp(36px,5vw,72px) }
.sec-head .label-row{ grid-column:1/-1 }
.sec-head h2{ grid-column:1/8 }
.sec-head .lead{ grid-column:8/13 }
@media (max-width:760px){ .sec-head h2,.sec-head .lead{ grid-column:1/-1 } }

/* glance */
.glance{ padding-block:clamp(28px,3.4vw,48px) clamp(72px,9vw,136px) }
.glance-t{ font-family:var(--f-display); font-size:clamp(30px,4.4vw,64px); line-height:1.3; font-weight:600; max-width:18em; margin-top:22px }
html[lang="en"] .glance-t{ font-weight:500; letter-spacing:-.03em; line-height:1.1 }
.skills-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px 40px; margin-top:clamp(28px,3.4vw,44px) }
.skills{ display:flex; flex-wrap:wrap; gap:8px; flex:1 1 480px }
.chip{ cursor:default }
.gl{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:clamp(22px,2.6vw,36px); border-top:1px solid var(--fg) }

/* wave gallery */
.wave{ padding-block:clamp(64px,8vw,120px) clamp(40px,5vw,72px); overflow:hidden }
.wave-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:clamp(8px,2vw,24px) }
.wave-head h2{ font-size:clamp(26px,3.2vw,44px); margin-top:14px }
.wave-track{ position:relative; height:clamp(340px,40vw,500px); cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none }
.wave-track.drag{ cursor:grabbing }
.wv{ position:absolute; left:0; top:50%; display:block; will-change:transform; cursor:pointer }
.wv img{ background:var(--well); height:var(--h); width:auto; max-width:none; display:block; pointer-events:none; box-shadow:0 20px 40px -20px rgba(0,0,0,.6); transition:transform .5s var(--spring) }
.wv:hover img{ transform:scale(1.12) }
.wv:hover{ z-index:5 }
.wv span{ position:absolute; left:0; top:calc(100% + 16px); font-size:12px; color:var(--fg); white-space:nowrap; opacity:0; transform:translateY(-4px); transition:opacity .3s, transform .3s; pointer-events:none }
.wv:hover span{ opacity:1; transform:none }

/* showcase: text + media side by side */
.show{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); column-gap:clamp(24px,4vw,72px); row-gap:32px; align-items:start }

.s-did-h{ font-family:var(--f-display); font-size:19px; font-weight:600; line-height:1.3; margin-bottom:10px }
html[lang="en"] .s-did-h{ font-weight:500; letter-spacing:-.01em }
.s-did{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; font-size:15px; line-height:1.5; border-top:1px solid var(--fg) }

.facts{ display:flex; flex-direction:column }
.facts li{ display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px }

@media (max-width:760px){
  .show,.show.flip{ grid-template-columns:1fr }

  .s-txt{ position:static }
}
@media (max-width:420px){ .s-did{ grid-template-columns:1fr } }

/* page header */
.phead{ padding-block:clamp(56px,9vw,120px) 0 }

.back{ display:inline-flex; gap:10px; align-items:center; height:44px; padding:0 22px 0 16px; border:1px solid var(--fg); border-radius:999px; text-decoration:none; font-family:var(--f-grotesk); font-size:14.5px; font-weight:600; color:var(--fg); transition:background-color .25s, border-color .25s, transform .45s var(--spring) }

/* project detail */
.dhead{ margin-top:28px; display:flex; flex-direction:column; gap:18px }
.dhead .sub{ font-family:var(--f-grotesk); font-size:clamp(16px,1.5vw,20px); color:var(--fg3); margin-top:-4px }
.dmeta{ display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; font-family:var(--f-grotesk); font-size:13px; color:var(--fg3); letter-spacing:.06em }
.dmeta b{ color:var(--fg); font-weight:600 }
.dintro{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); column-gap:var(--gap); row-gap:36px; margin-top:clamp(40px,6vw,88px); align-items:start }

details.more{ border-top:1px solid var(--line); border-bottom:1px solid var(--line) }

.band{ padding-block:clamp(64px,8vw,120px); margin-top:var(--sec) }
.stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--fg) }

@media (max-width:620px){ .stats{ grid-template-columns:repeat(2,minmax(0,1fr)) } .stats > div:nth-child(2n){ border-right:0 } .stats > div:nth-child(2n+1){ padding-left:0 } .stats > div:nth-child(-n+2){ border-bottom:1px solid var(--line) } }

.dots{ display:flex; flex-wrap:wrap; gap:6px }

.role{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); column-gap:var(--gap); row-gap:20px }

<script>
(() => {
'use strict';
const A = window.ASSETS, S = window.SITE, I = window.I18N;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;
const store = { get(k){ try { return localStorage.getItem(k) } catch(e){ return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e){} } };

let lang = store.get('zl-lang') === 'en' ? 'en' : 'zh';
let T = I[lang];
let route = 'home';

const pick = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[lang] || v.zh) : v;
const pad = (n) => String(n).padStart(2, '0');
const cap = (code) => T.assets[code] || code;
const esc = (s) => String(s).replace(/"/g, '&quot;');
const arrow = '<span class="arrow" aria-hidden="true">→</span>';
const fmt = (n) => n.toLocaleString('en-US');

/* ---------- building blocks ---------- */
function img(code, o = {}) {
  const a = A[code];
  if (!a || a.missing) return missing(code, o.ratio);
  const c = cap(code);
  return `<button type="button" class="zoom ${o.cls || ''}" data-lb="${o.group || 'g'}" data-code="${code}" aria-label="${esc(c)}">`
    + `<img src="${a.src}" width="${a.w}" height="${a.h}" alt="${esc(c)}" loading="${o.eager ? 'eager' : 'lazy'}" decoding="async"></button>`;
}
function fig(code, o = {}) {
  const text = o.caption === false ? '' : (o.caption || cap(code));
  return `<figure class="${o.fcls || ''}" ${o.style ? `style="${o.style}"` : ''} ${o.reveal ? 'data-reveal' : ''}>${img(code, o)}${text ? `<figcaption>${o.html || `<span>${text}</span>`}</figcaption>` : ''}</figure>`;
}
function missing(code, ratio = '4/3') {
  return `<div class="missing" style="aspect-ratio:${ratio}"><span class="code">${code}</span><span><b>${T.ui.missing}</b><br>${cap(code)}</span></div>`;
}
function video(code) {
  const a = A[code];
  return `<figure><button type="button" class="vid" data-video="${code}" aria-label="${T.ui.play}: ${esc(cap(code))}">`
    + `<img src="${a.poster}" alt="" loading="lazy" decoding="async"><span class="play"><i></i>${T.ui.play}</span></button>`
    + `<figcaption><span>${cap(code)}</span></figcaption></figure>`;

/* dock: a row of tiles that magnify like the macOS Dock; optional stage shows the hovered item large */
function dock(items, group, o = {}) {
  const list = items.map(x => typeof x === 'string' ? { code: x } : x);
  const tiles = list.map(x => {
    const a = A[x.code], isV = !!a.video, c = x.caption || cap(x.code);
    return `<button type="button" class="dk" ${isV ? `data-video="${x.code}"` : `data-lb="${group}" data-code="${x.code}"`} data-cap="${esc(c)}" aria-label="${esc(c)}"><img src="${isV ? a.poster : a.src}" alt="${esc(c)}" loading="lazy" decoding="async">${isV ? '<i class="pv"></i>' : ''}</button>`;
  }).join('');

  return `<div data-dockwrap>${stage}<div class="dock" style="--r:${o.ratio || '3/4'};${o.stage ? 'margin-top:clamp(18px,2.2vw,28px)' : ''}" data-dock>${tiles}</div>
    <p class="dock-cap"><b data-dcap>${f.caption || cap(f.code)}</b><span>${canHover ? T.show.dockHint : ''}</span></p></div>`;

function rootline(seed = 1) {
  let s = seed * 9301 + 49297; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  let d = 'M0 6', x = 0, y = 6; const pts = [];
  while (x < 1140) { x = Math.min(1196, x + 60 + r() * 50); y = 5 + r() * 3; d += ` L${x.toFixed(0)} ${y.toFixed(1)}`; pts.push([x, y]); }

    if (r() < .45) {

}
const labelRow = (t) => `<p class="label label-row">${t}</p>`;
const backHome = () => `<a class="back top" href="#home" data-back><span aria-hidden="true">←</span>${T.ui.backHome}</a>`;
/* justified row: every image in the row gets the same height and the row fills the width */
function jrow(items, group, o = {}) {
  return `<div class="jrow ${o.cls || ''}">${items.map(x => { const it = typeof x === 'string' ? { code: x } : x; const a = A[it.code]; return fig(it.code, { group, html: it.html, caption: it.caption === undefined ? (o.captions === false ? false : undefined) : it.caption, style: `--ar:${(a.w / a.h).toFixed(4)}` }); }).join('')}</div>`;
}

/* ---------- shared sections ---------- */
/* "at a glance": on the home page a static summary (each figure tagged with its chapter);
   on the About page the same six figures are cards linking to the exact section of each inner page */
function glance(linked) {
  const g = T.glance;
  const inner = (it) => `<span class="n"><span class="num ${it.n.length > 5 ? 'long' : ''}">${it.n}</span>${it.u ? `<span class="u">${it.u}</span>` : ''}</span><h3>${it.t}</h3><p>${it.d}</p>`;
  const cells = linked
    ? g.items.map((it, i) => `<a href="#${it.to}" ${S.glanceAt[i] ? `data-at="${S.glanceAt[i]}"` : ''} data-reveal style="--d:${(i % 3) * .08}s"><span class="go" aria-hidden="true">→</span>${inner(it)}</a>`).join('')
    : g.items.map((it, i) => `<div data-reveal style="--d:${(i % 3) * .08}s"><span class="k">${T.nav[it.to]}</span>${inner(it)}</div>`).join('');
  return `<section class="glance" data-mood="stone" data-anchor="glance"><div class="wrap">
    ${labelRow(linked ? g.labelAbout : g.label)}
    <div class="gl ${linked ? '' : 'static'}">${cells}</div>
    <div class="skills-row" data-reveal>
      <div class="skills">${g.skills.map(s => `<span class="chip">${s}</span>`).join('')}</div>
    </div>
  </div></section>`;
}

function projectShow(key, flip) {
  const d = T[key], D = S[key], isAC = key === 'ac', slug = isAC ? 'audience-choice' : 'anfm';
  const items = isAC
    ? [pick(D.cover), ...D.partners.slice(1).map(p => pick(p.img)), ...D.photos, D.promo]

  const extra = isAC ? `<div><span class="num">~${fmt(D.people.total)}</span><span>${d.peopleTitle}</span></div>` : '';

/* page "weather": background blends continuously between neighbouring sections; text colours switch at the seam */
const MOODS = { stone: [238, 240, 232], forest: [29, 74, 44], sky: [35, 71, 214] };
function setupMood() {
  const secs = $$('main [data-mood]');
  const apply = () => {
    const mid = innerHeight * .5, zone = innerHeight * .38;
    let idx = 0;
    secs.forEach((el, i) => { if (el.getBoundingClientRect().top <= mid) idx = i; });
    const cur = secs[idx], r = cur.getBoundingClientRect();
    let a = cur.dataset.mood, b = a, t = 0;
    const db = Math.max(0, r.bottom - mid), dt = Math.max(0, mid - r.top);
    if (db < zone && secs[idx + 1]) { b = secs[idx + 1].dataset.mood; t = .5 - db / zone * .5; }
    else if (dt < zone && secs[idx - 1]) { b = secs[idx - 1].dataset.mood; t = .5 - dt / zone * .5; }
    const ca = MOODS[a], cb = MOODS[b], u = t * 2, w = .5 * u * u * (3 - 2 * u);
    const c = ca.map((v, k) => Math.round(v + (cb[k] - v) * w));
    document.body.style.setProperty('--bg-live', `rgb(${c[0]},${c[1]},${c[2]})`);
    if (document.body.dataset.mood !== a) document.body.dataset.mood = a;

/* ---------- hero: tapered white roots on a cobalt sky ---------- */
const Roots = (() => {
  let cv, ctx, W = 0, H = 0, nodes = [], maxDist = 1, raf = 0, start = 0, grown = false, visible = true;
  const m = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4 };
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function add(x, y, p, dist) { nodes.push({ x, y, p, dist, ox: 0, oy: 0, vx: 0, vy: 0, rx: 0, ry: 0, kids: 0, tips: 0, w: 1, wt: 1, ph: x * .011 + y * .006 }); if (p >= 0) nodes[p].kids++; return nodes.length - 1; }
  function grow(pid, x, y, a, len, depth, r) {
    const k = 5 + Math.floor(r() * 4), seg = len / k;
    for (let i = 0; i < k; i++) {
      a += (r() - .5) * .3; a += (Math.PI / 2 - a) * .07;
      x += Math.cos(a) * seg; y += Math.sin(a) * seg;
      pid = add(x, y, pid, nodes[pid].dist + seg);
      if (depth < 6 && nodes.length < 2600 && r() < .3 - depth * .025) {
        const side = r() < .5 ? -1 : 1;
        grow(pid, x, y, a + side * (.45 + r() * .6), len * (.38 + r() * .3) * (1 - i / k * .4), depth + 1, r);
      }
    }
  }
  function build() {
    nodes = []; const r = rng(20251109);
    const mobile = W < 660;
    const n = mobile ? 5 : 8;
    const x0 = mobile ? W * .06 : W * .3, x1 = W * .99;
    const L = H * (mobile ? .52 : .9);
    for (let i = 0; i < n; i++) {
      const x = x0 + (x1 - x0) * (i + .5) / n + (r() - .5) * 40;
      const root = add(x, -10, -1, 0);
      grow(root, x, -10, Math.PI / 2 + (r() - .5) * .5, L * (.55 + r() * .45), 0, r);
    }
    for (let i = nodes.length - 1; i >= 0; i--) { const nd = nodes[i]; if (nd.kids === 0) nd.tips = 1; if (nd.p >= 0) nodes[nd.p].tips += nd.tips; }
    const sc = mobile ? .6 : 1;
    nodes.forEach(nd => { nd.w = Math.min(16, 1.2 + 1.3 * Math.sqrt(nd.tips)) * sc; nd.wt = 1 / (1 + nd.w * .45); });
    maxDist = nodes.reduce((mx, nd) => Math.max(mx, nd.dist), 1);
  }
  function resize() {
    const rect = cv.getBoundingClientRect(); const dpr = Math.min(devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height; cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); build();
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!visible) return;
    const t = now / 1000;
    let prog = 1;
    if (!grown && !reduce) { prog = Math.min(1, (now - start) / 2400); prog = 1 - Math.pow(1 - prog, 3); if (prog >= 1) grown = true; }
    m.x += (m.tx - m.x) * .16; m.y += (m.ty - m.y) * .16;
    const R = W < 660 ? 110 : 160, F = W < 660 ? 16 : 28;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (!reduce) {
        let tx = 0, ty = 0;
        const dx = n.x - m.x, dy = n.y - m.y, d = Math.hypot(dx, dy);
        if (d < R && d > .01) { const f = Math.pow(1 - d / R, 2) * F * n.wt; tx = dx / d * f; ty = dy / d * f * .5; }
        tx += Math.sin(t * .5 + n.ph) * (n.y / H) * 1.1 * n.wt;
        n.vx = (n.vx + (tx - n.ox) * .07) * .72; n.vy = (n.vy + (ty - n.oy) * .07) * .72;
        n.ox += n.vx; n.oy += n.vy;
      }
      const p = n.p >= 0 ? nodes[n.p] : null;
      n.rx = n.ox + (p ? p.rx * .92 : 0); n.ry = n.oy + (p ? p.ry * .92 : 0);
    }

      const n = nodes[i]; if (n.p < 0 || n.dist > lim) continue;
      const key = Math.round(n.w * 4) / 4;
      let b = buckets.get(key); if (!b) { b = []; buckets.set(key, b); } b.push(i);
    }

  /* shoots: wherever the cursor passes, nearby roots put out small green leaves that grow, linger and fade */
  const sprouts = [], LEAF = ['207,224,118', '170,209,107', '128,194,122', '222,236,160'];
  let lastSp = { x: -1e4, y: -1e4 };
  function spawn(x, y) {
    if (Math.hypot(x - lastSp.x, y - lastSp.y) < 14) return;
    lastSp = { x, y };
    const near = [];
    for (let i = 0; i < nodes.length; i++) { const n = nodes[i]; if (n.p < 0 || n.sp) continue; const d = Math.hypot(n.x + n.rx - x, n.y + n.ry - y); if (d < 70) near.push(i); }

  }
  function drawSprouts(now) {
    for (let k = sprouts.length - 1; k >= 0; k--) {
      const s = sprouts[k], n = nodes[s.i]; if (!n) { sprouts.splice(k, 1); continue; }
      const age = now - s.born;
      if (age > s.life) { n.sp = false; sprouts.splice(k, 1); continue; }
      const g0 = Math.min(1, age / 650), g = 1 + 2.2 * Math.pow(g0 - 1, 3) + 1.2 * Math.pow(g0 - 1, 2);
      const fade = age > s.life - 700 ? (s.life - age) / 700 : 1;
      const p = nodes[n.p], dir = Math.atan2(n.y + n.ry - (p.y + p.ry), n.x + n.rx - (p.x + p.rx));
      const bx = n.x + n.rx, by = n.y + n.ry, len = s.size * Math.max(0, g) * (fade < 1 ? .7 + .3 * fade : 1);
      leaf(bx, by, dir + s.side * 1.05, len, len * .36, s.c, .92 * fade);
      if (s.twin) leaf(bx, by, dir - s.side * .9, len * .7, len * .26, s.c, .85 * fade);
    }
  }
  const onMove = (e) => { const r = cv.getBoundingClientRect(); m.tx = e.clientX - r.left; m.ty = e.clientY - r.top; if (m.x < -1000) { m.x = m.tx; m.y = m.ty; } if (!reduce) spawn(m.tx, m.ty); };
  const onLeave = () => { m.tx = m.ty = m.x = m.y = -1e4; };
  return {
    start(el) {
      if (!el) return;
      cv = el; ctx = cv.getContext('2d'); resize(); start = performance.now();
      const host = cv.parentElement;
      host.addEventListener('pointermove', onMove); host.addEventListener('pointerleave', onLeave);
      let rt; const onR = () => { clearTimeout(rt); rt = setTimeout(() => { const r = cv.getBoundingClientRect(); if (Math.abs(r.width - W) > 2 || Math.abs(r.height - H) > 40) { resize(); if (reduce) raf = requestAnimationFrame(frame); } }, 150); };
      addEventListener('resize', onR);
      const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; }); io.observe(cv);
      raf = requestAnimationFrame(frame);
      cleanup.push(() => { cancelAnimationFrame(raf); removeEventListener('resize', onR); io.disconnect(); });
    }
  };
})();

/* ---------- wave gallery: a drifting ribbon riding a moving sine ---------- */
const Wave = {
  start(track) {
    if (!track) return;
    const items = $$('.wv', track);
    let W = 0, H = 0, ih = 0, total = 0, offset = 0, cur = 34, vel = 0, hover = false, visible = true, raf = 0, last = performance.now();
    let lastScroll = scrollY, drag = null;
    const layout = () => {
      W = track.clientWidth; H = track.clientHeight; ih = Math.round(H * .52);
      let x = 0; const gap = Math.max(24, W * .025);
      items.forEach(it => { const w = ih * parseFloat(it.dataset.ar); it._w = w; it._x = x; x += w + gap; it.style.setProperty('--h', ih + 'px'); });
      total = x;
    };
    layout();
    const place = (t) => {
      items.forEach(it => {
        let x = ((it._x - offset) % total + total) % total;
        if (x > W + 60) x -= total;
        const cx = (x + it._w / 2) / Math.max(W, 1);
        const ph = cx * Math.PI * 2 * .85 + t * .7;
        const y = Math.sin(ph) * H * .13 - ih / 2;
        const rot = Math.cos(ph) * 4.5;
        it.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg)`;
      });
    };
    const frame = (now) => {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (!visible) { lastScroll = scrollY; return; }
      const sv = scrollY - lastScroll; lastScroll = scrollY;
      vel += (sv * 2.2 - vel) * .12;
      cur += ((hover ? 0 : 34) - cur) * .06;
      if (!drag && !reduce) offset += (cur + vel * 6) * dt;
      place(reduce ? 0 : now / 1000);
    };
    track.addEventListener('mouseenter', () => hover = true);
    track.addEventListener('mouseleave', () => hover = false);
    track.addEventListener('pointerdown', e => { drag = { x: e.clientX, o: offset, moved: false, id: e.pointerId }; track.classList.add('drag'); });
    track.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x; if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; try { track.setPointerCapture(drag.id); } catch (_) {} } if (drag.moved) offset = drag.o - dx; });
    const end = () => { if (!drag) return; suppressClick = drag.moved; drag = null; track.classList.remove('drag'); };
    track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);
    const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; }); io.observe(track);
    const onR = () => layout(); addEventListener('resize', onR);
    place(0);
    raf = requestAnimationFrame(frame);
    cleanup.push(() => { cancelAnimationFrame(raf); io.disconnect(); removeEventListener('resize', onR); });
  }
};

render();
})();
